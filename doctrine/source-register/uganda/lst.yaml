- id: UG-LST-RATES
  topic: Uganda Local Service Tax employee wage bands and collection schedule
  jurisdiction: UG
  value_or_rule: "Annual employee LST bands are UGX 0 up to monthly income of 100,000; then 5,000, 10,000, 20,000, 30,000, 40,000, 60,000, 70,000, 80,000, 90,000, and 100,000 above 1,000,000. Employee LST may be deducted in four equal instalments during the first four months of the financial year."
